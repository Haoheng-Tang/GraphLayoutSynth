# Default GraphLayoutSynth healthcare/building config.
#
# Vocabulary tiers (see docs/ROOM_VOCABULARY.md):
# - allowed_node_types is the full canonical vocabulary the backend
#   recognizes (Program Requirements, room-type catalog, variant prompts).
# - room_type_counts and the grammar rules define the smaller default
#   essential generated mix.
# - The remaining allowed types are optional: valid on request (Program
#   Requirements, instruction-guided variants) but not generated by default.
#
# Graph node types are flat PascalCase IDs. Hierarchy lives in
# semantic_node_groups, never in nested type IDs. The `corridor` semantic
# group declares circulation types; validators and metrics consume the
# group, not type-name spelling. Legacy `Corridor`, `ClinicalSupport`, and
# `StaffSupport` were removed from the canonical vocabulary — imported
# floorplans may still carry those labels (request validation accepts
# unknown labels), but they are never generated or suggested.

project:
  name: GraphLayoutSynth generic building
  building_type: GenericBuilding

random_seed_default: 42

generation:
  num_candidates: 5

allowed_node_types:
  - BuildingFloor
  - Zone
  # Circulation.
  - OnStageCorridor
  - OffStageCorridor
  # Patient care.
  - PatientRoom
  # Staff work / administration.
  - NurseStation
  - TeamRoom
  - Office
  - ConferenceRoom
  # Clinical support.
  - MedicationRoom
  - CleanUtility
  - SoiledUtility
  - NourishmentRoom
  - LinenRoom
  - EquipmentRoom
  - StorageRoom
  - RespiratoryTherapyRoom
  - PPEStorage
  - ConsultRoom
  # Staff support.
  - StaffLounge
  - StaffToilet
  # Public / family.
  - PublicToilet
  - VisitorLounge
  - FamilyRoom
  - Dayroom
  - DiningRoom
  # Vertical circulation.
  - Stair
  - Elevator
  # Building services.
  - MEPRoom
  - ElectricalRoom
  - MechanicalRoom
  - TelecomRoom
  - UtilityRoom
  - Kitchen

allowed_edge_types:
  - door
  - wall

zone_types:
  - ward
  - service

# Default essential generated mix (nominal totals; PatientRoom varies with
# the sampled per-ward count range).
room_type_counts:
  PatientRoom: 24
  OnStageCorridor: 4
  OffStageCorridor: 1
  NurseStation: 2
  MedicationRoom: 2
  CleanUtility: 2
  SoiledUtility: 2
  EquipmentRoom: 2
  StorageRoom: 2
  StaffLounge: 1
  StaffToilet: 1
  PublicToilet: 1
  Stair: 2
  Elevator: 1
  MEPRoom: 1
  UtilityRoom: 1

semantic_node_groups:
  room_like:
    - PatientRoom
    - NurseStation
    - TeamRoom
    - Office
    - ConferenceRoom
    - MedicationRoom
    - CleanUtility
    - SoiledUtility
    - NourishmentRoom
    - LinenRoom
    - EquipmentRoom
    - StorageRoom
    - RespiratoryTherapyRoom
    - PPEStorage
    - ConsultRoom
    - StaffLounge
    - StaffToilet
    - PublicToilet
    - VisitorLounge
    - FamilyRoom
    - Dayroom
    - DiningRoom
    - Stair
    - Elevator
    - MEPRoom
    - ElectricalRoom
    - MechanicalRoom
    - TelecomRoom
    - UtilityRoom
    - Kitchen
  corridor:
    - OnStageCorridor
    - OffStageCorridor
  patient:
    - PatientRoom
  patient_care:
    - PatientRoom
  administration:
    - Office
    - TeamRoom
    - ConferenceRoom
  clinical_support:
    - NurseStation
    - MedicationRoom
    - CleanUtility
    - SoiledUtility
    - NourishmentRoom
    - LinenRoom
    - EquipmentRoom
    - RespiratoryTherapyRoom
    - PPEStorage
    - ConsultRoom
  staff_support:
    - StaffLounge
    - StaffToilet
  patient_support:
    - FamilyRoom
    - Dayroom
    - DiningRoom
  public_amenity:
    - VisitorLounge
    - PublicToilet
  vertical_circulation:
    - Stair
    - Elevator
  building_service:
    - MEPRoom
    - ElectricalRoom
    - MechanicalRoom
    - TelecomRoom
    - UtilityRoom
    - StorageRoom
    - Kitchen
  support:
    - NurseStation
    - MedicationRoom
    - CleanUtility
    - SoiledUtility
    - NourishmentRoom
    - LinenRoom
    - EquipmentRoom
    - StorageRoom
    - RespiratoryTherapyRoom
    - PPEStorage
    - ConsultRoom
    - StaffLounge
    - StaffToilet
    - UtilityRoom

typed_accessibility_pairs:
  - source_type: PatientRoom
    target_type: NurseStation
    edge_type: door
  - source_type: PatientRoom
    target_type: MedicationRoom
    edge_type: door
  - source_type: PatientRoom
    target_type: OnStageCorridor
    edge_type: door

stochastic:
  min_zone_count: 2
  max_zone_count: 3
  min_cluster_size: 2
  max_cluster_size: 4
  corridor_pattern_choices:
    - linear
    - hub
  support_room_choices:
    - MedicationRoom
    - CleanUtility
    - SoiledUtility
    - EquipmentRoom
    - StorageRoom

validation:
  require_connected_graph: true
  require_corridor_access: true
  allow_abstract_nodes_final: false

grammar_rules:
  - name: expand_floor_to_zones
    match:
      type: BuildingFloor
      is_abstract: true
    action:
      remove_matched_node: true
      create_nodes:
        - alias: ward_zone
          type: Zone
          count: 2
          attributes:
            zone_type: WardZone
            is_abstract: true
        - alias: service_zone
          type: Zone
          count: 1
          attributes:
            zone_type: ServiceZone
            is_abstract: true
      create_edges:
        - source: ward_zone
          target: ward_zone
          edge_type: door
          mode: adjacent_pairs
        - source: ward_zone
          target: service_zone
          edge_type: door
          mode: each_to_one

  - name: expand_ward_zone
    match:
      type: Zone
      zone_type: WardZone
      is_abstract: true
    action:
      remove_matched_node: true
      create_nodes:
        - alias: onstage
          type: OnStageCorridor
          count: 2
          attributes:
            is_abstract: false
        - alias: patient
          type: PatientRoom
          count:
            min: 10
            max: 12
          attributes:
            is_abstract: false
        - alias: nurse
          type: NurseStation
          count: 1
          attributes:
            is_abstract: false
        - alias: meds
          type: MedicationRoom
          count: 1
          attributes:
            is_abstract: false
        - alias: clean
          type: CleanUtility
          count: 1
          attributes:
            is_abstract: false
        - alias: soiled
          type: SoiledUtility
          count: 1
          attributes:
            is_abstract: false
        - alias: equipment
          type: EquipmentRoom
          count: 1
          attributes:
            is_abstract: false
        - alias: storage
          type: StorageRoom
          count: 1
          attributes:
            is_abstract: false
        - alias: stair
          type: Stair
          count: 1
          attributes:
            is_abstract: false
      create_edges:
        # The first on-stage corridor inherits the zone's connections so
        # inter-zone links survive expansion.
        - source: onstage
          target: __neighbors__
          edge_type: door
          mode: one_to_each
        - source: onstage
          target: onstage
          edge_type: door
          mode: adjacent_pairs
        # Patients spread across both on-stage corridors instead of piling
        # onto the first one.
        - source: patient
          target: onstage
          edge_type: door
          mode: balanced_each_to_one
          max_sources_per_target: 6
        # Distributed observation assignment: each patient room is served by
        # a nurse station with bounded load.
        - source: patient
          target: nurse
          edge_type: door
          mode: balanced_each_to_one
          max_sources_per_target: 12
        - source: nurse
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: meds
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: clean
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: soiled
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: equipment
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: storage
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: stair
          target: onstage
          edge_type: door
          mode: each_to_one
        - source: patient
          target: patient
          edge_type: wall
          mode: adjacent_pairs

  - name: expand_service_zone
    match:
      type: Zone
      zone_type: ServiceZone
      is_abstract: true
    action:
      remove_matched_node: true
      create_nodes:
        - alias: offstage
          type: OffStageCorridor
          count: 1
          attributes:
            is_abstract: false
        - alias: lounge
          type: StaffLounge
          count: 1
          attributes:
            is_abstract: false
        - alias: staff_toilet
          type: StaffToilet
          count: 1
          attributes:
            is_abstract: false
        - alias: public_toilet
          type: PublicToilet
          count: 1
          attributes:
            is_abstract: false
        - alias: elevator
          type: Elevator
          count: 1
          attributes:
            is_abstract: false
        - alias: mep
          type: MEPRoom
          count: 1
          attributes:
            is_abstract: false
        - alias: utility
          type: UtilityRoom
          count: 1
          attributes:
            is_abstract: false
      create_edges:
        - source: offstage
          target: __neighbors__
          edge_type: door
          mode: one_to_each
        - source: lounge
          target: offstage
          edge_type: door
          mode: each_to_one
        - source: staff_toilet
          target: offstage
          edge_type: door
          mode: each_to_one
        - source: public_toilet
          target: offstage
          edge_type: door
          mode: each_to_one
        - source: elevator
          target: offstage
          edge_type: door
          mode: each_to_one
        - source: mep
          target: offstage
          edge_type: door
          mode: each_to_one
        - source: utility
          target: offstage
          edge_type: door
          mode: each_to_one

ranking:
  weights:
    validation_passed: 100.0
    connected_graph: 20.0
    corridor_access_ratio: 30.0
    abstract_node_count: -20.0
    invalid_edge_type_count: -15.0
    disconnected_graph: -20.0
    edge_density: 10.0
    corridor_efficiency: 10.0
    door_wall_balance: 5.0
    distance_efficiency: 6.0
    dead_end_count: -2.0
    support_mix: 5.0
  targets:
    edge_node_ratio: 1.25
    corridor_fraction: 0.11
    door_wall_ratio: 4.0
    room_to_corridor_distance: 1.0
    max_room_to_corridor_distance_penalty_window: 4.0
    support_room_ratio: 0.25

