# Example user-facing program requirements for GraphLayoutSynth.
#
# This file contains real design/program decisions only: room types,
# min/target/max counts, and high-level adjacency preferences. Backend
# generation parameters (local group sizes, corridor hub limits, relaxation
# limits) are internal and never belong in this file.
#
# Room types are canonical IDs from GET /program-requirements/room-types
# (see docs/ROOM_VOCABULARY.md). Note: with the default
# configs/generic_building.yaml, the counts below intentionally trigger
# reachability warnings: the current static grammar generates 20-24 patient
# rooms and exactly 4 OnStageCorridor nodes, so meeting these larger targets
# requires proposing a validated config variant. Preflight warnings do not
# block variant proposal; errors do.

schemaVersion: 1

program:
  roomMix:
    PatientRoom:
      min: 50
      target: 56
      max: 60
    NurseStation:
      min: 4
      target: 5
      max: 6
    CleanUtility:
      min: 3
      target: 4
      max: 5
    StaffLounge:
      min: 2
      target: 3
      max: 4
    OnStageCorridor:
      min: 6
      target: 10
      max: 16
    Stair:
      min: 2
      target: 2
      max: 3
    Elevator:
      min: 1
      target: 2
      max: 2

adjacencyPreferences:
  - source: PatientRoom
    target: OnStageCorridor
    edgeType: door
    priority: required
  - source: NurseStation
    target: OnStageCorridor
    edgeType: door
    priority: preferred
  - source: PatientRoom
    target: PatientRoom
    edgeType: wall
    priority: preferred
